services:
  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/growth.db
      APP_ORIGIN: https://${DOMAIN}
      COOKIE_SECURE: "true"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      OWNER_EMAIL: ${OWNER_EMAIL:-${ADMIN_EMAIL}}
      PRIVATE_MODE: "true"
      BOOTSTRAP_INVITE: ${BOOTSTRAP_INVITE}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_TLS: ${MAIL_TLS:-true}
    volumes:
      - ./data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 192m
  worker:
    image: ${API_IMAGE}
    restart: unless-stopped
    command: ["python", "-m", "app.planner.worker"]
    environment:
      DATABASE_PATH: /data/growth.db
      UPLOAD_DIR: /data/uploads
      OWNER_EMAIL: ${OWNER_EMAIL:-${ADMIN_EMAIL}}
      AI_GATEWAY_URL: http://gateway:8091
      AI_GATEWAY_TOKEN: ${AI_GATEWAY_TOKEN:?Set an internal gateway secret}
    volumes:
      - ./data:/data
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 192m
  gateway:
    image: ${GATEWAY_IMAGE}
    restart: unless-stopped
    environment:
      AI_GATEWAY_TOKEN: ${AI_GATEWAY_TOKEN}
    volumes:
      - ./private/codex:/home/node/.codex
    expose:
      - "8091"
    read_only: true
    tmpfs:
      - /tmp:size=64m,uid=1000,gid=1000,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      NODE_OPTIONS: --max-old-space-size=256
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    mem_limit: 192m
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
volumes:
  caddy_data:
  caddy_config:
